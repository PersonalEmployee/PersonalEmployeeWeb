<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super.ПРОФ - Услуги</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #222;
            padding: 20px;
            text-align: center;
            color: #fff;
        }

        header h1 {
            margin: 0;
            font-size: 2em;
        }

        section {
            padding: 40px 20px;
        }

        /* Название агентства */
        .agency-title {
            text-align: center;
            font-size: 2em;
            margin-bottom: 30px;
            color: #222;
        }

        /* Услуги в оранжевом блоке */
        .services {
            background-color: #FFA500;
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .services ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .services li {
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        /* Подвал сайта */
        footer {
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 15px 20px;
            margin-top: 40px;
        }

        /* Адаптивность */
        @media(max-width: 640px) {
            body {
                font-size: 14px;
            }
            .services {
                padding: 15px;
            }
            header h1 {
                font-size: 1.5em;
            }
            .agency-title {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Super.ПРОФ</h1>
</header>

<section>
    <div class="agency-title">Агентство Super.ПРОФ</div>
    <div class="services">
        <ul>
            <li>• Разнорабочих для любых объектов</li>
            <li>• Подсобных рабочих</li>
            <li>• Рабочих для земельных работ</li>
            <li>• Грузчиков</li>
            <li>• Сварщиков</li>
            <li>• Электриков</li>
        </ul>
    </div>
</section>

<footer>
    <p>&copy; 2025 Агентство Super.ПРОФ. Все права защищены.</p>
</footer>

</body>
</html>
