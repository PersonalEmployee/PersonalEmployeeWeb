<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>АГЕНТСТВО SUPER.ПРОФ</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />

<style>
  /* Сброс и базовые стили */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #fff;
    color: #111;
    line-height: 1.6;
  }

  header {
    background: linear-gradient(90deg, #4b6cb7, #182848);
    color: #fff;
    padding: 60px 20px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-weight: 700;
    font-size: 3rem;
    letter-spacing: 2px;
  }

  main {
    max-width: 960px;
    margin: 40px auto;
    padding: 0 20px;
  }

  h2 {
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 24px;
    border-bottom: 4px solid #4b6cb7;
    padding-bottom: 8px;
    color: #222;
  }

  /* Стили для горизонтального списка — убраны, так как используем вертикальный */

  /* Новые стили для вертикального списка услуг */
  ul.services-list-vertical {
    list-style: none;
    padding: 0;
    margin: 0 0 40px 0;
    display: flex;
    flex-direction: column;
    gap: 15px; /* расстояние между блоками */
  }

  ul.services-list-vertical li {
    background: #f5f7fa;
    border-radius: 12px;
    padding: 15px 20px;
    font-weight: 500;
    font-size: 1.1rem;
    box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    transition: transform 0.3s ease;
    cursor: default;
  }

  ul.services-list-vertical li:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.12);
  }

  .image-section {
    margin-bottom: 60px;
    text-align: center;
  }
