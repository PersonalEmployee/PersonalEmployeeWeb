<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Агентство - Услуги рабочих</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #f0f0f0;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        
        .agency-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .header-image {
            width: 100%;
            height: 230px;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            margin: 0 auto;
        }
        
        .content-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .services-column {
            width: 60%;
            vertical-align: top;
            padding: 0;
        }
        
        .contact-column {
            width: 40%;
            vertical-align: top;
            padding: 0;
        }
        
        .services-header {
            background-color: #f5f5f5;
            padding: 15px;
            font-weight: bold;
            font-size: 18px;
            border-bottom: 1px solid #ddd;
        }
        
        .services-list {
            padding: 15px;
        }
        
        .services-list ul {
            list-style-type: none;
        }
        
        .services-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .services-list li:last-child {
            border-bottom: none;
        }
        
        .contact-option {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #ddd;
        }
        
        .contact-icon {
            width: 25px;
            height: 25px;
            background-color: #e0e0e0;
            border-radius: 3px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #555;
        }
        
        .contact-text {
            flex-grow: 1;
        }
        
        .contact-form {
            padding: 15px;
        }
        
        .contact-form p {
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .phone-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        .submit-btn {
            background-color: #4a7bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        
        .divider {
            height: 1px;
            background-color: #ddd;
            width: 100%;
        }
        
        @media (max-width: 768px) {
            .content-table, .services-column, .contact-column {
                display: block;
                width: 100%;
            }
            
            .header-image {
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="agency-name">Агентство</div>
            <div class="header-image">Изображение агентства</div>
        </div>
        
        <table class="content-table">
            <tr>
                <td class="services-column">
                    <div class="services-header">УСЛУГИ:</div>
                    <div class="services-list">
                        <ul>
                            <li>Разнорабочих для любых объектов</li>
                            <li>Подсобных рабочих</li>
                            <li>Рабочих для земельных работ</li>
                            <li>Грузчиков</li>
                            <li>Сварщиков</li>
                            <li>Электриков</li>
                            <li>и т.п.</li>
                        </ul>
                    </div>
                </td>
                <td class="contact-column">
                    <div class="contact-option">
                        <div class="contact-icon">T</div>
                        <div class="contact-text">позвонить</div>
                    </div>
                    <div class="contact-option">
                        <div class="contact-icon">M</div>
                        <div class="contact-text">написать</div>
                    </div>
                    <div class="contact-option">
                        <div class="contact-text">Оставить заявку</div>
                    </div>
                    <div class="contact-form">
                        <p>Оставьте номер телефона мы перезвони Вам:</p>
                        <input type="tel" class="phone-input" placeholder="+7 (___) ___-__-__">
                        <button class="submit-btn">Отправить</button>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <script>
        // Простая обработка формы
        document.querySelector('.submit-btn').addEventListener('click', function() {
            const phone = document.querySelector('.phone-input').value;
            if (phone) {
                alert('Спасибо! Мы перезвоним Вам по номеру: ' + phone);
                document.querySelector('.phone-input').value = '';
            } else {
                alert('Пожалуйста, введите номер телефона');
            }
        });
        
        // Обработка кликов по контактным опциям
        document.querySelectorAll('.contact-option').forEach(option => {
            option.addEventListener('click', function() {
                const action = this.querySelector('.contact-text').textContent;
                if (action === 'позвонить') {
                    alert('Позвонить по номеру: +7 (XXX) XXX-XX-XX');
                } else if (action === 'написать') {
                    alert('Написать на email: info@агентство.ru');
                } else if (action === 'Оставить заявку') {
                    document.querySelector('.phone-input').focus();
                }
            });
        });
    </script>
</body>
</html>
