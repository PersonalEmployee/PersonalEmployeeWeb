<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>АГЕНСТВО SUPER.ПРОФ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2em;
        }
        section {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        h2 {
            color: #34495e;
        }
        ul {
            list-style: disc inside;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        a.button {
            padding: 12px 20px;
            background-color: #2980b9;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        a.button:hover {
            background-color: #3498db;
        }
        form {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            max-width: 400px;
        }
        input[type="tel"] {
            padding: 10px;
            font-size: 1em;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button.submit-btn {
            padding: 12px 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button.submit-btn:hover {
            background-color: #2ecc71;
        }
        footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>АГЕНСТВО SUPER.ПРОФ</h1>
</header>

<section>
    <h2>Наши услуги</h2>
    <ul>
        <li>Разнорабочие для любых объектов</li>
        <li>Подсобные рабочие</li>
        <li>Рабочие для земельных работ</li>
        <li>Грузчики</li>
        <li>Сварщики</li>
        <li>Электрики</li>
        <li>и т.п.</li>
    </ul>
</section>

<section>
    <h2>Контакты</h2>
    <div class="buttons">
        <a href="tel:+70000000000" class="button">Позвонить</a>
        <a href="https://wa.me/70000000000" target="_blank" class="button">Написать в WhatsApp</a>
    </div>
    <h3>Оставьте свой номер для обратного звонка</h3>
    <form id="callbackForm">
        <input type="tel" name="phone" placeholder="Ваш номер телефона" required>
        <button type="submit" class="submit-btn">Отправить</button>
    </form>
</section>

<footer>
    <p>&copy; 2024 Агентство SUPER.ПРОФ</p>
</footer>

<script>
    // Обработка формы для демонстрации
    document.getElementById('callbackForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const phone = e.target.elements['phone'].value;
        alert('Спасибо! Ваша заявка на обратный звонок принята: ' + phone);
        e.target.reset();
        // Здесь можно интегрировать отправку данных на сервер
    });
</script>

</body>
</html>
