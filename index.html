<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super.ПРОФ - Услуги</title>
<!-- Вставляем шрифты Google для стильного вида -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<!-- Иконки Font Awesome (для иконок в будущем) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  /* Общие стили */
  body {
    margin: 0;
    padding: 0;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(to right, #ece9e6, #ffffff);
    color: #333;
    line-height: 1.6;
  }

  /* Шапка сайта */
  header {
    background: linear-gradient(135deg, #f96d00, #ff6f00);
    padding: 40px 20px;
    text-align: center;
    color: #fff;
  }

  header h1 {
    font-size: 3em;
    margin: 0;
    letter-spacing: 2px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  /* Область с названием агентства */
  .agency-section {
    max-width: 1200px;
    margin: 50px auto 30px auto;
    padding: 0 20px;
  }

  .agency-title {
    text-align: center;
    font-size: 2.5em;
    margin-bottom: 30px;
    font-weight: 700;
    color: #222;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  }

  /* Секция услуг */
  .services {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    padding: 50px 30px;
    max-width: 1000px;
    margin: 0 auto;
    transition: all 0.3s ease;
  }

  .services:hover {
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    transform: translateY(-5px);
  }

  /* Заголовок раздела */
  .services-header {
    text-align: center;
    font-size: 2em;
    margin-bottom: 40px;
    font-weight: 700;
    color: #444;
  }

  /* Список с услугами */
  ul {
    list-style: none;
    padding: 0;
  }

  li {
    font-size: 1.4em;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    transition: all 0.3s ease;
  }

  /* Иконки перед пунктами (если потребуется) */
  li::before {
    content: "\f0ca"; /* иконка грузовой тележки */
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    margin-right: 15px;
    color: #ff6f00;
    font-size: 1.5em;
  }

  li:hover {
    color: #f96d00;
  }

  /* Кнопка записи (дополнительно) */
  .btn-primary {
    display: inline-block;
    background-color: #ff6f00;
    color: #fff;
    padding: 15px 30px;
    text-decoration: none;
    font-size: 1.2em;
    border-radius: 30px;
    margin-top: 40px;
    transition: background-color 0.3s ease, transform 0.2s ease;
  }

  .btn-primary:hover {
    background-color: #f96d00;
    transform: scale(1.05);
  }

  /* Подвал сайта */
  footer {
    background-color: #222;
    color: #ccc;
    text-align: center;
    padding: 20px;
    margin-top: 50px;
  }

  /* Мобильная адаптация */
  @media(max-width: 768px) {
    header h1 {
      font-size: 2em;
    }
    .agency-title {
      font-size: 2em;
    }
    .services {
      padding: 30px 20px;
    }
    li {
      font-size: 1.2em;
    }
    .btn-primary {
      padding: 12px 25px;
      font-size: 1em;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Super.ПРОФ</h1>
</header>

<!-- Раздел с названием агентства -->
<div class="agency-section">
  <div class="agency-title">Агентство Super.ПРОФ</div>
</div>

<!-- Блок услуг -->
<section class="services">
  <div class="services-header">Наши услуги</div>
  <ul>
    <li>Разнорабочих для любых объектов</li>
    <li>Подсобных рабочих</li>
    <li>Рабочих для земельных работ</li>
    <li>Грузчиков</li>
    <li>Сварщиков</li>
    <li>Электриков</li>
  </ul>
  <!-- Кнопка для связи или заказа -->
  <div style="text-align: center;">
    <a href="#contact" class="btn-primary">Связаться с нами</a>
  </div>
</section>

<!-- Футер сайта -->
<footer>
  <p>&copy; 2025 Агентство Super.ПРОФ. Все права защищены.</p>
</footer>

</body>
</html>
